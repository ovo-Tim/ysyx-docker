name: docker

# Manual only: builds and pushes a Docker Hub variant matrix
# (no-Chisel/no-EDA, chisel, eda, full). Costs nothing otherwise.
on:
  workflow_dispatch:
    inputs:
      include_base:
        description: 'ovotim/ysyx:latest (no Chisel, no EDA)'
        type: boolean
        default: true
      include_chisel:
        description: 'ovotim/ysyx:chisel (Chisel, no EDA)'
        type: boolean
        default: true
      include_eda:
        description: 'ovotim/ysyx:eda (no Chisel, full EDA, amd64, ~2GB downloads)'
        type: boolean
        default: true
      include_full:
        description: 'ovotim/ysyx:full (Chisel + full EDA, amd64)'
        type: boolean
        default: true

env:
  IMAGE: ovotim/ysyx

permissions:
  contents: read

jobs:
  build:
    name: Build + test + push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            tag: latest
            sha_suffix: ''
            with_chisel: 0
            with_eda: 0
            enabled: include_base
          - name: chisel
            tag: chisel
            sha_suffix: '-chisel'
            with_chisel: 1
            with_eda: 0
            enabled: include_chisel
          - name: eda
            tag: eda
            sha_suffix: '-eda'
            with_chisel: 0
            with_eda: 1
            enabled: include_eda
          - name: full
            tag: full
            sha_suffix: '-full'
            with_chisel: 1
            with_eda: 1
            enabled: include_full
    steps:
      - uses: actions/checkout@v4
        if: inputs[matrix.enabled]

      - uses: docker/setup-buildx-action@v3
        if: inputs[matrix.enabled]

      - name: Log in to Docker Hub
        if: inputs[matrix.enabled]
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build image (load locally)
        if: inputs[matrix.enabled]
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            WITH_CHISEL=${{ matrix.with_chisel }}
            WITH_EDA=${{ matrix.with_eda }}
          tags: ${{ env.IMAGE }}:ci
          # Early layers (apt, Homebrew Verilator) are identical across all
          # variants and hit the shared cache; only the EDA jobs add extra
          # layers, which are kept in a dedicated scope.
          cache-from: type=gha
          cache-to: type=gha${{ matrix.with_eda == 1 && ',scope=eda' || '' }},mode=max

      - name: Smoke-test image
        if: inputs[matrix.enabled]
        env:
          WITH_CHISEL: ${{ matrix.with_chisel }}
          WITH_EDA: ${{ matrix.with_eda }}
        run: |
          docker run --rm \
            -e WITH_CHISEL="$WITH_CHISEL" -e WITH_EDA="$WITH_EDA" \
            ${{ env.IMAGE }}:ci \
            bash -euo pipefail -x -c '
              # Container default user
              test "$(id -un)" = ysyx
              sudo -n true
              echo "DBG PATH=$PATH"
              echo "DBG HOME=$HOME"
              ls -l /home/linuxbrew/.linuxbrew/bin/verilator || true
              test "$(command -v verilator)" = /home/linuxbrew/.linuxbrew/bin/verilator
              verilator --version
              sudo -Hu linuxbrew -- /home/linuxbrew/.linuxbrew/bin/brew list --versions verilator
              # sed -n 1p reads to EOF: head -n 1 would SIGPIPE the writer
              # (exit 141) and pipefail would kill the whole script.
              iverilog -V 2>&1 | sed -n 1p
              yosys -V
              z3 --version
              riscv64-linux-gnu-gcc --version | sed -n 1p
              riscv64-unknown-elf-gcc --version | sed -n 1p
              # PATH prefers Homebrew, whose python3 has no apt numpy;
              # the apt numpy lives in /usr/bin/python3.
              /usr/bin/python3 -c "import numpy"
              test "$(git config --system --get url.https://github.com/.insteadof)" = "git@github.com:"
              ysyx-setup
              test -x /home/ysyx/ysyx-workbench/init.sh
              # Build-time compiled NVBoard archive must ship in every variant.
              test -s /opt/nvboard/build/nvboard.a
              test -s /usr/local/lib/libnvboard.a

              if [[ "$WITH_CHISEL" == 1 ]]; then
                mill version
                java -version 2>&1 | sed -n 1p
                # Chisel playground was compiled/tested at build time; its
                # dependency caches ship in the image for downstream reuse.
                test -d /opt/chisel-playground
                test -n "$(ls -A "${COURSIER_CACHE:?}")"
              else
                test ! -e /usr/local/bin/mill
                test ! -e /usr/bin/java
                test ! -e /opt/chisel-playground
              fi
              if [[ "$WITH_EDA" == 1 ]]; then
                /opt/oss-cad-suite/bin/yosys -V
                test -x /opt/ecc/ecc
                test -x /usr/local/bin/ecos-studio
                test -f "$ICS55_PDK/patch/patch.sh"
                test -d "$ICS55_PDK/.git"
              else
                test ! -e /opt/oss-cad-suite/bin/yosys
                test ! -f "$ICS55_PDK/patch/patch.sh"
              fi
            '

      - name: Push to Docker Hub
        if: inputs[matrix.enabled]
        env:
          TAG: ${{ matrix.tag }}
          SHA_SUFFIX: ${{ matrix.sha_suffix }}
        run: |
          short="${GITHUB_SHA::7}"
          docker tag ${{ env.IMAGE }}:ci "$IMAGE:$TAG"
          docker tag ${{ env.IMAGE }}:ci "$IMAGE:sha-$short$SHA_SUFFIX"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:sha-$short$SHA_SUFFIX"
